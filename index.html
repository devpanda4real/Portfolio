    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef8ff',
              100: '#d8efff',
              200: '#b9e4ff',
              300: '#89d4ff',
              400: '#52bbff',
              500: '#2b9cff',
              600: '#157eff',
              700: '#0d65e9',
              800: '#1251bc',
              900: '#144694',
            },
            dark: {
              950: '#070b14',
              900: '#0b1120',
              850: '#0f172a',
              800: '#1e293b',
            }
          },
          animation: {
            'blob': 'blob 14s infinite cubic-bezier(0.4, 0, 0.2, 1)',
            'pulse-glow': 'pulseGlow 4s infinite ease-in-out',
            'float': 'float 5s infinite ease-in-out',
          },
          keyframes: {
            blob: {
              '0%, 100%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(40px, -50px) scale(1.12)' },
              '66%': { transform: 'translate(-30px, 35px) scale(0.92)' },
            },
            pulseGlow: {
              '0%, 100%': { opacity: '0.3', transform: 'scale(1)' },
              '50%': { opacity: '0.6', transform: 'scale(1.05)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-6px)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #070b14;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #38bdf8;
    }

    /* Background Cyber Grid Pattern */
    .bg-cyber-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      mask-image: radial-gradient(ellipse 70% 60% at 50% 20%, #000 60%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 20%, #000 60%, transparent 100%);
    }

    /* Glassmorphic Navbar & Floating Dock */
    .glass-nav {
      background: rgba(11, 17, 32, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }
    .glass-dock {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 25px -5px rgba(56, 189, 248, 0.15);
    }

    /* Vercel/Linear Interactive Mouse Spotlight Card */
    .spotlight-card {
      position: relative;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1.25rem;
      overflow: hidden;
      transition: border-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
    }
    .spotlight-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: inherit;
      background: radial-gradient(600px circle at var(--mouse-x, -500px) var(--mouse-y, -500px), rgba(56, 189, 248, 0.12), transparent 40%);
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
      z-index: 1;
    }
    .spotlight-card:hover::before {
      opacity: 1;
    }
    .spotlight-card:hover {
      border-color: rgba(56, 189, 248, 0.35);
      transform: translateY(-3px);
      box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.5), 0 0 20px -5px rgba(56, 189, 248, 0.15);
    }

    /* Scroll Reveal Animation Classes */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }
    .reveal.active {
      opacity: 1 !important;
      transform: translateY(0) !important;
    }

    /* Animated gradient text shimmer */
    .shimmer-text {
      background: linear-gradient(90deg, #38bdf8 0%, #818cf8 35%, #34d399 70%, #38bdf8 100%);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: textShimmer 6s linear infinite;
    }
    /* Windows Terminal Component Styles & Theme Swapping */
    /* Terminal Container Base */
    #windows-terminal-window {
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
